<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gilda+Display&family=Nunito+Sans:wght@400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #d6e4e1;
    font-family: 'Nunito Sans', sans-serif;
    padding: 30px 40px 20px;
  }

  h1 {
    text-align: center;
    font-family: 'Gilda Display', serif;
    font-size: 38px;
    color: #2d4a46;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #7b2d3e;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: 700;
    margin-bottom: 30px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }

  .row2 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin: 14px auto 0;
    width: 81%;
  }

  .item {
    text-align: center;
  }

  .illustration { margin-bottom: 8px; }
  .illustration svg { width: 100%; height: auto; }

  .label {
    font-size: 12px;
    font-weight: 800;
    color: #2d4a46;
    line-height: 1.25;
  }

  .who {
    font-size: 10px;
    color: #7b2d3e;
    font-weight: 600;
    margin-top: 2px;
  }
</style>
</head>
